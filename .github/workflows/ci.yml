name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build AutoInvoicing.sln -c Release
      - name: Test
        run: dotnet test AutoInvoicing.sln -c Release --no-build --logger "console;verbosity=normal"
